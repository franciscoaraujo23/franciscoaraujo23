<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Problems I solve: duplicate runs, runaway costs, no audit trail, risky autonomy">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <rect x="0.5" y="0.5" width="234" height="189" rx="16" fill="#0f172a" stroke="#334155"/>
    <rect x="22" y="26" width="36" height="4" rx="2" fill="url(#accent)"/>
    <text x="22" y="64" font-size="18" font-weight="700" fill="#f8fafc">Duplicate runs</text>
    <text x="22" y="94" font-size="13" fill="#94a3b8">Retries and double webhooks</text>
    <text x="22" y="114" font-size="13" fill="#94a3b8">never act twice.</text>
    <text x="22" y="156" font-size="11" fill="#2dd4bf" font-weight="600" letter-spacing="1">IDEMPOTENT</text>

    <!-- card 2 -->
    <rect x="255.5" y="0.5" width="234" height="189" rx="16" fill="#0f172a" stroke="#334155"/>
    <rect x="277" y="26" width="36" height="4" rx="2" fill="url(#accent)"/>
    <text x="277" y="64" font-size="18" font-weight="700" fill="#f8fafc">Runaway costs</text>
    <text x="277" y="94" font-size="13" fill="#94a3b8">Hard caps per run and day,</text>
    <text x="277" y="114" font-size="13" fill="#94a3b8">so a loop cannot burn budget.</text>
    <text x="277" y="156" font-size="11" fill="#818cf8" font-weight="600" letter-spacing="1">COST CAPPED</text>

    <!-- card 3 -->
    <rect x="510.5" y="0.5" width="234" height="189" rx="16" fill="#0f172a" stroke="#334155"/>
    <rect x="532" y="26" width="36" height="4" rx="2" fill="url(#accent)"/>
    <text x="532" y="64" font-size="18" font-weight="700" fill="#f8fafc">No audit trail</text>
    <text x="532" y="94" font-size="13" fill="#94a3b8">Every action logged, so you</text>
    <text x="532" y="114" font-size="13" fill="#94a3b8">can see what the system did.</text>
    <text x="532" y="156" font-size="11" fill="#2dd4bf" font-weight="600" letter-spacing="1">AUDIT LOGGED</text>

    <!-- card 4 -->
    <rect x="765.5" y="0.5" width="234" height="189" rx="16" fill="#0f172a" stroke="#334155"/>
    <rect x="787" y="26" width="36" height="4" rx="2" fill="url(#accent)"/>
    <text x="787" y="64" font-size="18" font-weight="700" fill="#f8fafc">Risky autonomy</text>
    <text x="787" y="94" font-size="13" fill="#94a3b8">Agents with a shell or an inbox,</text>
    <text x="787" y="114" font-size="13" fill="#94a3b8">kept behind real boundaries.</text>
    <text x="787" y="156" font-size="11" fill="#818cf8" font-weight="600" letter-spacing="1">REAL BOUNDARIES</text>
  </g>
</svg>
