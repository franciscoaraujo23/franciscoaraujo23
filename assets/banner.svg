<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Francisco Araújo, AI systems engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#16204a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>

    <!-- left: identity -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="56" y="84" font-size="15" fill="#2dd4bf" letter-spacing="3" font-weight="600">AI SYSTEMS ENGINEER</text>
      <text x="56" y="150" font-size="54" fill="#ffffff" font-weight="700">Francisco Araújo</text>
      <rect x="56" y="170" width="84" height="4" rx="2" fill="url(#accent)"/>
      <text x="56" y="212" font-size="22" fill="#c7d2fe">Systems first, model second.</text>
      <text x="56" y="244" font-size="15" fill="#94a3b8">Agents and automation that hold up in production</text>
    </g>

    <!-- right: pipeline, one straight line, left to right -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <!-- line and traveling dot sit under the boxes so they only show in the gaps -->
      <path d="M556 150 H964" stroke="#475569" stroke-width="2" fill="none"/>
      <circle r="4.5" fill="#2dd4bf">
        <animateMotion dur="4s" repeatCount="indefinite" path="M556 150 H964"/>
      </circle>

      <rect x="556" y="130" width="64" height="40" rx="10" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="588" y="155" fill="#e2e8f0">Lead</text>

      <rect x="654" y="130" width="70" height="40" rx="10" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.8"/>
      <text x="689" y="155" fill="#e2e8f0">Agent</text>

      <rect x="758" y="130" width="108" height="40" rx="10" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.8"/>
      <text x="812" y="155" font-size="12" fill="#e2e8f0">Human approval</text>

      <rect x="900" y="130" width="64" height="40" rx="10" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="932" y="155" fill="#e2e8f0">CRM</text>

      <text x="760" y="212" font-size="11" fill="#64748b" font-weight="500" letter-spacing="1.5">HUMAN IN THE LOOP</text>
    </g>
  </g>
</svg>
